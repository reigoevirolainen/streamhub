<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreamHub Eesti — Hype-O-Meter</title>
  
  <link rel="icon" type="image/png" href="https://cdn.phototourl.com/member/2026-08-20-ab6e8157-85d2-41f1-9fec-7253e8261e59.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
  
  <style>
    .game-layout { max-width: 1200px; margin: 40px auto; padding: 0 clamp(20px, 5vw, 40px); display: grid; grid-template-columns: 1fr 350px; gap: 40px; align-items: start; }
    .game-container { background: linear-gradient(180deg, var(--panel), #0a0a11); border: 1px solid rgba(255,255,255,.06); border-radius: 24px; padding: 40px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
    .game-title { font-family: 'Space Grotesk', sans-serif; font-size: 36px; margin-top: 0; margin-bottom: 10px; background: linear-gradient(90deg, #ff5d7a, #e03ca4); -webkit-background-clip: text; color: transparent; }
    
    /* Timer & Score Display */
    .stats-board { display: flex; justify-content: space-around; background: #0a0a11; border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin: 30px 0; }
    .stat-box { display: flex; flex-direction: column; align-items: center; }
    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }
    .stat-value { font-family: 'Space Grotesk', sans-serif; font-size: 42px; font-weight: 900; color: #fff; }
    #timer { color: #59e0a8; }
    
    /* The Big Click Button - LISATUD MOBIILI SUUMIMISE KAITSE */
    .click-area { 
      position: relative; margin: 40px auto; width: 200px; height: 200px; 
      touch-action: manipulation; /* Keelab suumimise nupu ümbert */
    }
    .click-btn { 
      width: 100%; height: 100%; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #e03ca4, #9655ff);
      box-shadow: 0 0 30px rgba(224,60,164,0.4), inset 0 0 20px rgba(255,255,255,0.2);
      color: white; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 900;
      cursor: pointer; transition: transform 0.05s ease, box-shadow 0.05s ease;
      display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none;
      touch-action: manipulation; /* SEE PARANDAB TOPELTVAJUTUSE SUUMIMISE! */
    }
    .click-btn:active { transform: scale(0.92); box-shadow: 0 0 15px rgba(224,60,164,0.6); }
    .click-btn:disabled { filter: grayscale(100%); opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    
    /* Click ripples */
    .ripple { position: absolute; border-radius: 50%; border: 2px solid #e03ca4; animation: rippleAnim 0.5s linear forwards; pointer-events: none; }
    @keyframes rippleAnim { 0% { width: 200px; height: 200px; top: 0; left: 0; opacity: 1; } 100% { width: 300px; height: 300px; top: -50px; left: -50px; opacity: 0; } }

    .controls { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
    .name-input { background: #0d0d15; border: 1px solid var(--line); color: white; padding: 12px 20px; border-radius: 12px; font-family: 'Inter', sans-serif; font-size: 16px; width: 220px; outline: none; transition: 0.3s; }
    .name-input:focus { border-color: #e03ca4; }
    .name-input:read-only { opacity: 0.6; cursor: not-allowed; border-color: var(--line); }
    .action-btn { padding: 12px 30px; font-size: 16px; letter-spacing: 1px; font-family: 'Space Grotesk', sans-serif; min-width: 160px; background: linear-gradient(135deg, #ff5d7a, #e03ca4); border:none; color:#fff; border-radius: 12px; font-weight: 800; cursor: pointer; }
    .action-btn:hover { filter: brightness(1.1); }
    
    #message-box { margin-top: 20px; height: 40px; font-weight: 700; font-size: 18px; color: #9e9cb3; }

    /* Scoreboard styles */
    .scoreboard { background: var(--panel); border: 1px solid rgba(255,255,255,.06); border-radius: 24px; padding: 30px; }
    .scoreboard h3 { font-family: 'Space Grotesk', sans-serif; margin-top: 0; margin-bottom: 20px; font-size: 24px; }
    .score-list { display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; padding-right: 8px; }
    .score-list::-webkit-scrollbar { width: 6px; }
    .score-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
    .score-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }
    .score-item { display: flex; justify-content: space-between; padding: 12px 16px; background: #151521; border-radius: 10px; border: 1px solid var(--line); font-weight: 600; }
    .score-name { color: #fff; }
    .score-value { color: var(--green); font-family: 'Space Grotesk'; font-weight: 800; }

    @media(max-width: 900px) { .game-layout { grid-template-columns: 1fr; } .controls { flex-direction: column; align-items: center; } .name-input { width: 100%; max-width: 300px; } .action-btn { width: 100%; max-width: 300px; } }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html">
      <img src="https://cdn.phototourl.com/free/2026-08-20-416aa20b-acbe-4325-9e61-566645e3254c.png" alt="Streaming Hub logo">
    </a>
    <nav class="nav">
      <a href="index.html#games">MÄNGUD</a>
      <a href="index.html#live">LIVE</a>
      <a href="index.html#streamers">STRIIMERID</a>
      <a href="index.html#about">INFO</a>
      <a href="uudised.html">UUDISED</a>
      <a href="wheel.html" style="color: var(--pink); text-shadow: 0 0 10px rgba(224,60,164,0.5);">SPINNINGWHEEL</a>
      <a href="fishing.html" style="color: #00bfff; text-shadow: 0 0 10px rgba(0,191,255,0.5);">KALAPÜÜK</a>
      <a href="clicker.html" style="color: #59e0a8; text-shadow: 0 0 10px rgba(89,224,168,0.5);">HYPE-O-METER</a>
    </nav>
    <div class="actions">
      <button class="btn" id="userBtn">KASUTAJA</button>
      <button class="primary" id="adminBtn">ADMIN</button>
    </div>
  </header>

  <main>
    <div class="game-layout">
      <div class="game-container">
        <h2 class="game-title">Hype-O-Meter</h2>
        <p style="color: var(--muted); margin-top: 0;">Sul on 10 sekundit. Kliki nuppu nii kiiresti kui suudad!</p>
        
        <div class="stats-board">
          <div class="stat-box">
            <span class="stat-label">Aeg</span>
            <span class="stat-value" id="timer">10.0</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Klikke</span>
            <span class="stat-value" id="clickCount">0</span>
          </div>
        </div>

        <div class="click-area" id="clickArea">
          <button class="click-btn" id="hypeBtn" disabled>OOTEL</button>
        </div>

        <div class="controls" id="startControls">
          <input type="text" id="playerName" class="name-input" placeholder="Sinu hüüdnimi..." autocomplete="off">
          <button id="startBtn" class="action-btn">ALUSTA MÄNGU</button>
        </div>
        
        <div id="message-box">Tõesta, et oled kiireim! (1 klikk = 2 punkti)</div>
      </div>

      <div class="scoreboard">
        <h3>Globaalne Edetabel 🏆</h3>
        <p style="font-size: 12px; color: var(--muted); margin-top: -15px;"></p>
        <div class="score-list" id="scoreList"></div>
      </div>
    </div>
  </main>

  <script>
    const clickSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'); 
    clickSound.volume = 0.2;
    const finishSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2015/2015-preview.mp3');
    finishSound.volume = 0.5;

    const hypeBtn = document.getElementById('hypeBtn');
    const startBtn = document.getElementById('startBtn');
    const nameInput = document.getElementById('playerName');
    const timerDisplay = document.getElementById('timer');
    const clickDisplay = document.getElementById('clickCount');
    const msgBox = document.getElementById('message-box');
    const clickArea = document.getElementById('clickArea');

    let score = 0;
    let timeLeft = 10.0;
    let gameInterval = null;
    let isPlaying = false;
    const badWords = ["türa", "putsi", "vitt", "munn", "pede", "lits", "hoor", "kurat", "pask", "nuss"];

    let scores = JSON.parse(localStorage.getItem('streamingHubScores')) || [];
    let myRegisteredName = localStorage.getItem('sh_my_name');

    if (myRegisteredName) { 
      nameInput.value = myRegisteredName; 
      nameInput.readOnly = true; 
    }
    renderScoreboard();

    startBtn.addEventListener('click', () => {
      if (isPlaying) return;

      if (!myRegisteredName) {
        const playerName = nameInput.value.trim();
        if(playerName.length < 2) { msgBox.innerHTML = `<span style="color: var(--red)">Palun sisesta pikkem nimi!</span>`; return; }
        const isBad = badWords.some(word => playerName.toLowerCase().includes(word));
        if(isBad) { msgBox.innerHTML = `<span style="color: var(--red)">Selline nimi pole lubatud!</span>`; return; }
        const existingUser = scores.find(s => s.name.toLowerCase() === playerName.toLowerCase());
        if (existingUser) { msgBox.innerHTML = `<span style="color: var(--red)">❌ Nimi on juba võetud!</span>`; return; }

        myRegisteredName = playerName;
        localStorage.setItem('sh_my_name', myRegisteredName);
        nameInput.readOnly = true;
      }

      startGame();
    });

    function startGame() {
      isPlaying = true;
      score = 0;
      timeLeft = 10.0;
      clickDisplay.textContent = '0';
      timerDisplay.textContent = '10.0';
      timerDisplay.style.color = '#59e0a8';
      msgBox.innerHTML = `<span style="color: #e03ca4">KLIKI NII KIIRESTI KUI SAAD!</span>`;
      
      startBtn.style.display = 'none';
      hypeBtn.disabled = false;
      hypeBtn.textContent = 'HYPE!';

      gameInterval = setInterval(() => {
        timeLeft -= 0.1;
        timerDisplay.textContent = timeLeft.toFixed(1);

        if (timeLeft <= 3.0) {
          timerDisplay.style.color = '#ff5d7a';
        }

        if (timeLeft <= 0.01) { // 0.0 asemel on täpsem panna 0.01 JS komakoha matemaatika tõttu
          endGame();
        }
      }, 100);
    }

    hypeBtn.addEventListener('click', (e) => {
      if (!isPlaying) return;
      
      score++;
      clickDisplay.textContent = score;

      let clickNode = clickSound.cloneNode();
      clickNode.volume = 0.2;
      clickNode.play().catch(err => {});

      createRipple();
    });

    function createRipple() {
      const ripple = document.createElement('div');
      ripple.classList.add('ripple');
      clickArea.appendChild(ripple);
      setTimeout(() => { ripple.remove(); }, 500);
    }

    function endGame() {
      clearInterval(gameInterval);
      isPlaying = false;
      hypeBtn.disabled = true;
      hypeBtn.textContent = 'LÄBI!';
      timerDisplay.textContent = '0.0';
      startBtn.style.display = 'inline-block';
      startBtn.textContent = 'MÄNGI UUESTI';

      finishSound.currentTime = 0;
      finishSound.play().catch(e=>{});

      const pointsWon = score * 2;
      
      let feedback = "";
      if (score < 40) feedback = "Külmad näpud? Sa suudad paremini!";
      else if (score < 70) feedback = "Päris hea kiirus!";
      else if (score < 100) feedback = "Uskumatu tempo! Ehtne gamer.";
      else feedback = "KAS SA OLED ROBOT?! 🤯";

      msgBox.innerHTML = `<span style="color: var(--green)">Aeg läbi! Tegid ${score} klikki.<br>Teenisid +${pointsWon} punkti. ${feedback}</span>`;

      if (pointsWon > 0) {
        saveScore(myRegisteredName, pointsWon);
      }
    }

    function saveScore(name, amount) {
      const existingUser = scores.find(s => s.name.toLowerCase() === name.toLowerCase());
      if(existingUser) {
        existingUser.score += amount;
      } else {
        scores.push({ name: name, score: amount });
      }
      scores.sort((a, b) => b.score - a.score);
      localStorage.setItem('streamingHubScores', JSON.stringify(scores));
      renderScoreboard();
    }

    function renderScoreboard() {
      const list = document.getElementById('scoreList');
      list.innerHTML = '';
      const top50 = scores.slice(0, 50);
      
      if(top50.length === 0) {
        list.innerHTML = '<div style="color: var(--muted); padding: 20px;">Edetabel on tühi.</div>';
        return;
      }

      top50.forEach((player, index) => {
        let rankStr = `${index + 1}.`;
        if(index === 0) rankStr = '🥇';
        if(index === 1) rankStr = '🥈';
        if(index === 2) rankStr = '🥉';

        list.innerHTML += `
          <div class="score-item">
            <span class="score-name">${rankStr} ${player.name}</span>
            <span class="score-value">${player.score}</span>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
