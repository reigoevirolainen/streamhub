<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>24/7 Fitness Logi</title>
    
    <!-- Veebilehe Ikoon (Favicon) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💪</text></svg>">
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- HTML2PDF Teek (Uusim stabiilne versioon) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --bg-main: rgba(0, 0, 0, 0.85); 
            --bg-card: rgba(18, 18, 20, 0.95); 
            --bg-input: rgba(28, 28, 30, 0.8);
            --neon: #ccff00; 
            --text-main: #ffffff; 
            --text-muted: #a1a1aa;
            --border: #27272a; 
            --red: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1470&auto=format&fit=crop') no-repeat center center fixed; 
            background-size: cover;
            display: flex; 
            justify-content: center; 
            color: var(--text-main); 
        }

        .app-container { 
            width: 100%; 
            max-width: 480px; 
            background-color: var(--bg-main); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            min-height: 100vh; 
            position: relative; 
            padding-bottom: 100px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }

        .view { display: none; animation: fadeIn 0.2s ease; flex-grow: 1; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* HEADER & PROFILE */
        .top-header { padding: 20px 20px 10px; position: sticky; top: 0; z-index: 10; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-weight: 900; font-size: 22px; font-style: italic; }
        .logo span { color: var(--neon); }

        .profile-card { margin: 15px 20px 20px; background: var(--bg-card); border-radius: 12px; padding: 16px; display: flex; align-items: center; gap: 15px; border: 1px solid var(--border); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .avatar { width: 45px; height: 45px; background: #222; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--neon); flex-shrink: 0; }
        .profile-info { flex-grow: 1; overflow: hidden; }
        .profile-info h3 { font-size: 16px; font-weight: 700; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .profile-info p { color: var(--text-muted); font-size: 12px; }
        .btn-outline { border: 1px solid var(--neon); color: var(--neon); background: transparent; padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; flex-shrink: 0; }

        /* FILTRID (SKROLLITAV) */
        .section-header { padding: 0 20px; margin-bottom: 12px; font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: #fff; }
        
        .filter-wrapper { width: 100%; overflow: hidden; }
        .filter-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 0 20px 15px 20px; scrollbar-width: none; -webkit-overflow-scrolling: touch; align-items: center; }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-scroll::after { content: ''; padding-right: 12px; }
        
        .filter-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; flex: 0 0 auto; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .filter-btn i { font-size: 14px; }
        .filter-btn.active { border-color: var(--neon); color: black; background: var(--neon); }

        /* MASINATE LIST */
        .machine-list { display: flex; flex-direction: column; gap: 12px; padding: 0 20px 20px; }
        .machine-card { background: var(--bg-card); border-radius: 12px; padding: 16px; border: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.1s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .machine-card:active { transform: scale(0.98); }
        .machine-card h4 { font-size: 15px; font-weight: 700; margin-bottom: 4px; color: #fff; }
        .machine-card p { font-size: 12px; color: var(--text-muted); line-height: 1.4; font-weight: 500;}
        .machine-icon-container { display: flex; align-items: center; gap: 15px; }
        .machine-icon-container i.list-icon { color: var(--neon); font-size: 22px; min-width: 30px; display: inline-block; text-align: center; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 30px 20px; font-size: 14px; }

        /* TREENINGU LOGIMINE */
        .logger-header { display: flex; align-items: center; justify-content: space-between; padding: 20px; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); }
        .icon-btn { background: none; border: none; color: var(--text-main); font-size: 20px; cursor: pointer; }
        .logger-title { font-weight: 800; font-size: 16px; text-align: center; flex-grow: 1; padding: 0 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; letter-spacing: 0.5px;}
        
        .sets-section { padding: 20px; flex-grow: 1; }
        .sets-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .sets-table th { color: var(--text-muted); font-size: 12px; font-weight: 600; text-align: center; padding-bottom: 15px; text-transform: uppercase; }
        .sets-table td { padding: 6px 4px; text-align: center; }
        .set-input { width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: white; padding: 14px; border-radius: 10px; text-align: center; font-size: 16px; font-weight: 700; outline: none; }
        .set-input:focus { border-color: var(--neon); }
        
        .btn-add { background: transparent; border: 1px dashed var(--border); color: var(--text-muted); width: 100%; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 15px; transition: 0.2s; }
        .btn-primary { width: 100%; background: var(--neon); color: black; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(204, 255, 0, 0.2); text-transform: uppercase;}
        .btn-del { color: var(--red); background: none; border: none; font-size: 18px; cursor: pointer; padding: 10px; }

        /* MASINA INFO JA PILT ALLOSAS */
        .machine-info-box { margin: 20px; padding: 15px; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); display: flex; gap: 15px; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .machine-img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; background: #111; border: 1px solid #333; flex-shrink: 0; }
        .machine-details { flex-grow: 1; }
        .machine-details h5 { color: var(--neon); font-size: 12px; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        .machine-details p { font-size: 14px; color: white; font-weight: 700; margin-bottom: 6px; line-height: 1.2;}
        .machine-details .alt { font-size: 12px; color: var(--text-muted); font-weight: 500; }
        .machine-details .alt span { color: #fff; }

        /* AJALUGU */
        .history-list { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .history-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .history-card-header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 12px; }
        .history-date { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-weight: 500;}
        .history-machine { font-size: 15px; font-weight: 800; color: var(--text-main); }
        .history-set { display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); }
        .history-set:last-child { border-bottom: none; }
        .history-del-btn { color: var(--red); background: rgba(239, 68, 68, 0.1); border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-weight: 700; height: fit-content;}

        .btn-pdf { background: #222; border: 1px solid var(--border); color: white; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        
        /* ALUMINE MENÜÜ */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: rgba(10, 10, 12, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 10px 25px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 11px; font-weight: 600; cursor: pointer; border: none; background: none; }
        .nav-item i { font-size: 20px; transition: 0.2s; }
        .nav-item.active { color: var(--neon); }
    </style>
</head>
<body>

    <div class="app-container" id="main-app">
        
        <!-- ================= 1. AVALEHT ================= -->
        <div id="view-home" class="view active">
            <header class="top-header">
                <div class="logo">24/7 <span>FITNESS</span></div>
            </header>

            <div class="profile-card">
                <div class="avatar"><i class="fa-solid fa-user"></i></div>
                <div class="profile-info">
                    <h3 id="ui-name">Nimetu</h3>
                    <p><span id="ui-age">0</span> a • <span id="ui-weight">0</span> kg</p>
                </div>
                <button class="btn-outline" onclick="app.editProfile()">Muuda</button>
            </div>

            <div class="section-header">Vali lihasgrupp</div>
            
            <div class="filter-wrapper">
                <div class="filter-scroll" id="filter-container">
                    <!-- Genereeritakse JS abil -->
                </div>
            </div>
            
            <div class="machine-list" id="exercise-list">
                <!-- Masinad genereeritakse JS abil -->
            </div>
        </div>

        <!-- ================= 2. LOGI TREENINGUT ================= -->
        <div id="view-logger" class="view">
            <header class="logger-header">
                <button class="icon-btn" onclick="app.navTo('view-home', 0)"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="logger-title" id="logger-machine-name">Harjutus</div>
                <div style="width:20px;"></div>
            </header>

            <div class="sets-section">
                <table class="sets-table">
                    <thead>
                        <tr>
                            <th style="width: 15%;">Seeria</th>
                            <th style="width: 35%;">Raskus (kg)</th>
                            <th style="width: 35%;">Kordused</th>
                            <th style="width: 15%;"></th>
                        </tr>
                    </thead>
                    <tbody id="logger-sets-body">
                        <!-- Sisestusväljad -->
                    </tbody>
                </table>

                <button class="btn-add" onclick="app.addSet()">+ Lisa uus seeria</button>
                <button class="btn-primary" onclick="app.saveWorkout()">Salvesta harjutus</button>
            </div>

            <!-- MASINA INFO JA PILT ALLOSAS -->
            <div class="machine-info-box" id="machine-info-box">
                <img src="" alt="Machine" class="machine-img" id="machine-img">
                <div class="machine-details">
                    <h5>Soovituslik Pink</h5>
                    <p id="machine-desc">Gymleco Pink</p>
                    <div class="alt">Alternatiiv: <span id="machine-alt">-</span></div>
                </div>
            </div>
        </div>

        <!-- ================= 3. TREENINGUTE AJALUGU & PDF ================= -->
        <div id="view-history" class="view">
            <header class="top-header">
                <div class="logo">Minu <span>Ajalugu</span></div>
                <button class="btn-pdf" onclick="app.exportPDF()"><i class="fa-solid fa-file-pdf"></i> PDF</button>
            </header>

            <div class="history-list" id="history-container">
                <!-- Ajalugu genereeritakse siia -->
            </div>
        </div>

        <!-- ================= ALUMINE MENÜÜ ================= -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="app.navTo('view-home', 0)">
                <i class="fa-solid fa-dumbbell"></i><span>Treeni</span>
            </button>
            <button class="nav-item" onclick="app.navTo('view-history', 1)">
                <i class="fa-regular fa-calendar-check"></i><span>Ajalugu</span>
            </button>
        </nav>

    </div>

    <!-- JAVASCRIPT -->
    <script>
        const getImgUrl = (text) => `https://placehold.co/400x400/1c1c1e/ccff00?text=${encodeURIComponent(text.replace(' ', '\n'))}&font=montserrat`;

        const app = {
            profile: JSON.parse(localStorage.getItem('247app_profile_v8')) || { name: '', age: '', weight: '' },
            history: JSON.parse(localStorage.getItem('247app_history_v8')) || [],
            
            activeFilters: [],
            currentExercise: null,
            currentSets: [],

            categories: [
                { id: 'Rind', icon: 'fa-dumbbell' },
                { id: 'Ülaselg', icon: 'fa-child-reaching' },
                { id: 'Alaselg', icon: 'fa-weight-hanging' },
                { id: 'Õlad', icon: 'fa-arrows-up-to-line' },
                { id: 'Biitseps', icon: 'fa-hand-fist' },
                { id: 'Triitseps', icon: 'fa-bolt' },
                { id: 'Reied', icon: 'fa-shoe-prints' },
                { id: 'Sääred', icon: 'fa-shoe-prints' },
                { id: 'Kõht', icon: 'fa-cubes' }
            ],

            exercises: [
                // RIND
                { name: 'Bench Press', target: 'Rind', desc: 'Gymleco Olympic Flat Bench', alt: 'Smith masin / Hantlid lamades', icon: 'fa-dumbbell', img: getImgUrl('Bench Press') },
                { name: 'Incline Dumbbell Press', target: 'Rind', desc: 'Gymleco Adjustable Bench + Hantlid', alt: 'Kaldpink kangiga / Smith', icon: 'fa-dumbbell', img: getImgUrl('Incline Press') },
                { name: 'Pec Deck Fly', target: 'Rind', desc: 'Gymleco Pec Deck plokkmasin', alt: 'Hantlitega lendamine', icon: 'fa-arrows-left-right', img: getImgUrl('Pec Deck') },
                { name: 'Cable Crossover', target: 'Rind', desc: 'Gymleco ristveo masin', alt: 'Pec Deck / Lendamine hantlitega', icon: 'fa-bolt', img: getImgUrl('Cable Cross') },
                { name: 'Dips', target: 'Rind', desc: 'Gymleco Dip Station', alt: 'Assisted Dip masin', icon: 'fa-arrow-down', img: getImgUrl('Dips') },
                
                // ÜLASELG
                { name: 'Lat Pulldown', target: 'Ülaselg', desc: 'Gymleco Lat Pulldown masin', alt: 'Lõuatõmbed / Assisted Pull-up', icon: 'fa-arrow-down', img: getImgUrl('Lat Pulldown') },
                { name: 'Seated Cable Row', target: 'Ülaselg', desc: 'Gymleco Seated Row masin', alt: 'T-Bar Row / Hantliga tõmbed', icon: 'fa-arrow-right-to-bracket', img: getImgUrl('Seated Row') },
                { name: 'T-Bar Row', target: 'Ülaselg', desc: 'Gymleco T-Bar masin / Kangi ots', alt: 'Seated Cable Row / Kangi tõmbed', icon: 'fa-dumbbell', img: getImgUrl('T-Bar Row') },
                { name: 'Pull-Ups', target: 'Ülaselg', desc: 'Gymleco Lõuatõmbe kang', alt: 'Lat Pulldown masin', icon: 'fa-arrow-up', img: getImgUrl('Pull-Ups') },
                { name: 'Face Pulls', target: 'Ülaselg', desc: 'Gymleco ristveo masin + köis', alt: 'Rear Delt Fly masin', icon: 'fa-bullseye', img: getImgUrl('Face Pulls') },
                
                // ALASELG
                { name: 'Deadlift (Jõutõmme)', target: 'Alaselg', desc: 'Vabaraskus kang tõsteplatvormil', alt: 'Smith masinal / Hantlitega', icon: 'fa-arrow-up', img: getImgUrl('Deadlift') },
                { name: 'Back Extension', target: 'Alaselg', desc: 'Gymleco Roman Chair (Seljapink)', alt: 'Good Mornings kangiga', icon: 'fa-person', img: getImgUrl('Back Extension') },
                { name: 'Good Mornings', target: 'Alaselg', desc: 'Kükipuur + Kang vabalanguses', alt: 'Back Extension pink', icon: 'fa-child-reaching', img: getImgUrl('Good Mornings') },
                
                // REIED
                { name: 'Barbell Squat', target: 'Reied', desc: 'Gymleco Kükipuur (Half Rack)', alt: 'Smith masina kükk / Hack Squat', icon: 'fa-arrow-up', img: getImgUrl('Squat') },
                { name: 'Leg Press', target: 'Reied', desc: 'Gymleco 45° Leg Press masin', alt: 'Kükk kangiga / Hack Squat', icon: 'fa-shoe-prints', img: getImgUrl('Leg Press') },
                { name: 'Romanian Deadlift', target: 'Reied', desc: 'Vabaraskus kang / Hantlid', alt: 'Kõhuli Reiekõverdused', icon: 'fa-weight-hanging', img: getImgUrl('RDL') },
                { name: 'Leg Extension', target: 'Reied', desc: 'Gymleco Leg Extension masin', alt: 'Väljaasted / Bulgaaria kükk', icon: 'fa-person-walking', img: getImgUrl('Leg Extension') },
                { name: 'Leg Curl', target: 'Reied', desc: 'Gymleco Istuv/Lamav Leg Curl', alt: 'RDL / Good Mornings', icon: 'fa-person-running', img: getImgUrl('Leg Curl') },
                
                // SÄÄRED
                { name: 'Standing Calf Raise', target: 'Sääred', desc: 'Gymleco Standing Calf masin', alt: 'Smith masin / Hantliga ühel jalal', icon: 'fa-shoe-prints', img: getImgUrl('Standing Calf') },
                { name: 'Seated Calf Raise', target: 'Sääred', desc: 'Gymleco Seated Calf masin', alt: 'Kang põlvedel istudes', icon: 'fa-chair', img: getImgUrl('Seated Calf') },

                // ÕLAD
                { name: 'Overhead Press (OHP)', target: 'Õlad', desc: 'Kangi surumine seistes (Half Rack)', alt: 'Hantlitega surumine istudes', icon: 'fa-arrow-up', img: getImgUrl('Overhead Press') },
                { name: 'Lateral Raise', target: 'Õlad', desc: 'Hantlid vabaraskuste alal', alt: 'Kaablitega lendamine küljele', icon: 'fa-arrows-up-to-line', img: getImgUrl('Lateral Raise') },
                { name: 'Reverse Pec Deck', target: 'Õlad', desc: 'Gymleco Pec Deck (tagurpidi)', alt: 'Face Pulls / Kummardades lendamine', icon: 'fa-arrows-left-right', img: getImgUrl('Reverse Deck') },
                
                // BIITSEPS
                { name: 'Barbell Bicep Curl', target: 'Biitseps', desc: 'Sirge või EZ kang vabaraskustest', alt: 'Hantlitega Curls', icon: 'fa-dumbbell', img: getImgUrl('Barbell Curl') },
                { name: 'Hammer Curls', target: 'Biitseps', desc: 'Hantlid vabaraskuste alal', alt: 'Kaabliga Hammer Curl', icon: 'fa-gavel', img: getImgUrl('Hammer Curls') },
                { name: 'Preacher Curl', target: 'Biitseps', desc: 'Gymleco Scott pink + EZ kang', alt: 'Masinal Preacher Curl', icon: 'fa-hand-holding', img: getImgUrl('Preacher Curl') },
                
                // TRIITSEPS
                { name: 'Tricep Pushdown', target: 'Triitseps', desc: 'Gymleco ristveo masin + köis/sirge', alt: 'Tricep Kickbacks hantliga', icon: 'fa-hand-back-fist', img: getImgUrl('Pushdown') },
                { name: 'Skullcrushers', target: 'Triitseps', desc: 'Lamades Gymleco pink + EZ kang', alt: 'Overhead Tricep Ext.', icon: 'fa-bolt', img: getImgUrl('Skullcrusher') },
                
                // KÕHT
                { name: 'Cable Crunch', target: 'Kõht', desc: 'Gymleco ristveo masin + köis', alt: 'Kõhulihaste masin', icon: 'fa-cubes', img: getImgUrl('Cable Crunch') },
                { name: 'Hanging Leg Raise', target: 'Kõht', desc: 'Lõuatõmbe kangil rippudes', alt: 'Istesse tõusud pingil', icon: 'fa-person', img: getImgUrl('Leg Raise') }
            ],

            init: function() {
                this.updateProfileUI();
                this.renderFilters();
                this.renderExerciseList();
                this.renderHistory();
            },

            updateProfileUI: function() {
                document.getElementById('ui-name').innerText = this.profile.name || 'Sisesta nimi';
                document.getElementById('ui-age').innerText = this.profile.age || '-';
                document.getElementById('ui-weight').innerText = this.profile.weight || '-';
            },

            editProfile: function() {
                const newName = prompt("Sinu nimi:", this.profile.name);
                if(newName === null) return;
                const newAge = prompt("Sinu vanus:", this.profile.age);
                if(newAge === null) return;
                const newWeight = prompt("Sinu kaal (kg):", this.profile.weight);
                if(newWeight === null) return;
                
                this.profile = { name: newName.trim(), age: newAge.trim(), weight: newWeight.trim() };
                localStorage.setItem('247app_profile_v8', JSON.stringify(this.profile));
                this.updateProfileUI();
            },

            navTo: function(viewId, navIndex) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(viewId).classList.add('active');
                
                if(navIndex !== null) {
                    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.nav-item')[navIndex].classList.add('active');
                }
                
                if(viewId === 'view-history') this.renderHistory();
                window.scrollTo(0,0);
            },

            renderFilters: function() {
                const container = document.getElementById('filter-container');
                container.innerHTML = '';
                
                this.categories.forEach(cat => {
                    const isActive = this.activeFilters.includes(cat.id);
                    container.innerHTML += `
                        <button class="filter-btn ${isActive ? 'active' : ''}" onclick="app.toggleFilter('${cat.id}')">
                            <i class="fa-solid ${cat.icon}"></i> ${cat.id}
                        </button>
                    `;
                });
            },

            toggleFilter: function(category) {
                const index = this.activeFilters.indexOf(category);
                if (index > -1) {
                    this.activeFilters.splice(index, 1);
                } else {
                    this.activeFilters.push(category);
                }
                this.renderFilters();
                this.renderExerciseList();
            },

            renderExerciseList: function() {
                const list = document.getElementById('exercise-list');
                list.innerHTML = '';
                
                const filteredExercises = this.exercises.filter(ex => {
                    if (this.activeFilters.length === 0) return true;
                    return this.activeFilters.includes(ex.target);
                });

                if (filteredExercises.length === 0) {
                    list.innerHTML = '<div class="empty-state">Sellele valikule vastavaid harjutusi ei leitud.</div>';
                    return;
                }

                filteredExercises.forEach(ex => {
                    list.innerHTML += `
                        <div class="machine-card" onclick="app.openLogger('${ex.name}')">
                            <div class="machine-icon-container">
                                <i class="fa-solid ${ex.icon} list-icon"></i>
                                <div>
                                    <h4>${ex.name}</h4>
                                    <p>${ex.target}</p>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right" style="color: var(--neon); font-size: 18px;"></i>
                        </div>
                    `;
                });
            },

            openLogger: function(exerciseName) {
                this.currentExercise = this.exercises.find(e => e.name === exerciseName);
                if(!this.currentExercise) return;

                document.getElementById('logger-machine-name').innerText = this.currentExercise.name;
                document.getElementById('machine-img').src = this.currentExercise.img;
                document.getElementById('machine-desc').innerText = this.currentExercise.desc;
                document.getElementById('machine-alt').innerText = this.currentExercise.alt;

                this.currentSets = [{ weight: '', reps: '' }];
                this.renderLoggerSets();
                this.navTo('view-logger', null);
            },

            renderLoggerSets: function() {
                const tbody = document.getElementById('logger-sets-body');
                tbody.innerHTML = '';
                
                this.currentSets.forEach((set, index) => {
                    tbody.innerHTML += `
                        <tr>
                            <td style="color: var(--neon); font-size: 16px; font-weight: 800;">${index + 1}</td>
                            <td><input type="number" class="set-input" placeholder="0" value="${set.weight}" onchange="app.updateSet(${index}, 'weight', this.value)"></td>
                            <td><input type="number" class="set-input" placeholder="0" value="${set.reps}" onchange="app.updateSet(${index}, 'reps', this.value)"></td>
                            <td><button class="btn-del" onclick="app.removeSet(${index})"><i class="fa-solid fa-xmark"></i></button></td>
                        </tr>
                    `;
                });
            },

            updateSet: function(index, field, value) {
                this.currentSets[index][field] = value;
            },

            addSet: function() {
                const lastSet = this.currentSets.length > 0 ? this.currentSets[this.currentSets.length - 1] : { weight: '', reps: '' };
                this.currentSets.push({ weight: lastSet.weight, reps: '' });
                this.renderLoggerSets();
            },

            removeSet: function(index) {
                this.currentSets.splice(index, 1);
                this.renderLoggerSets();
            },

            saveWorkout: function() {
                const validSets = this.currentSets.filter(s => s.weight !== '' && s.reps !== '');
                
                if(validSets.length === 0) {
                    alert("Palun sisesta vähemalt üks kehtiv seeria (raskus ja kordused)!");
                    return;
                }

                const workoutEntry = {
                    id: Date.now(),
                    date: new Date().toLocaleDateString('et-EE'),
                    time: new Date().toLocaleTimeString('et-EE', {hour: '2-digit', minute:'2-digit'}),
                    machine: this.currentExercise.name,
                    sets: validSets
                };

                this.history.unshift(workoutEntry);
                localStorage.setItem('247app_history_v8', JSON.stringify(this.history));
                
                this.navTo('view-history', 1);
            },

            renderHistory: function() {
                const container = document.getElementById('history-container');
                container.innerHTML = '';
                
                if(this.history.length === 0) {
                    container.innerHTML = '<div class="empty-state" style="margin-top: 40px;"><i class="fa-solid fa-clipboard-list" style="font-size: 40px; margin-bottom: 15px; opacity: 0.5;"></i><br>Ajalugu puudub.<br>Alusta treenimist ja logi oma esimene harjutus!</div>';
                    return;
                }

                this.history.forEach((session, sessionIndex) => {
                    let setsHTML = '';
                    session.sets.forEach((s, i) => {
                        setsHTML += `
                            <div class="history-set">
                                <span style="color: var(--text-muted);">Seeria ${i + 1}</span>
                                <span><strong style="color: white;">${s.weight}</strong> kg × <strong style="color: white;">${s.reps}</strong> kordust</span>
                            </div>
                        `;
                    });

                    container.innerHTML += `
                        <div class="history-card">
                            <div class="history-card-header">
                                <div>
                                    <div class="history-machine">${session.machine}</div>
                                    <div class="history-date"><i class="fa-regular fa-calendar" style="margin-right: 4px;"></i>${session.date} kell ${session.time}</div>
                                </div>
                                <button class="history-del-btn" onclick="app.deleteHistoryEntry(${sessionIndex})">Kustuta</button>
                            </div>
                            <div style="padding-top: 4px;">
                                ${setsHTML}
                            </div>
                        </div>
                    `;
                });
            },

            deleteHistoryEntry: function(index) {
                if(confirm("Kas oled kindel, et soovid selle harjutuse ajaloost kustutada?")) {
                    this.history.splice(index, 1);
                    localStorage.setItem('247app_history_v8', JSON.stringify(this.history));
                    this.renderHistory();
                }
            },

            // TÄIELIKULT LOLLIKINDEL PDF-I GENEREERIMINE
            exportPDF: function() {
                if(this.history.length === 0) {
                    alert("Ajalugu on tühi, pole midagi salvestada!");
                    return;
                }

                // Kerime täiesti üles, et vältida brauseri scrolli bugi
                window.scrollTo(0, 0);

                // 1. Loome PDF sisu HTMLi stringina
                let pdfContentHTML = `
                    <div style="max-width: 600px; margin: 0 auto; color: #000; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
                        <h1 style="text-align: center; margin-bottom: 5px; color: #000; font-weight: 900; font-size: 24px;">24/7 FITNESS LOGI</h1>
                        <p style="text-align: center; margin-bottom: 20px; color: #555; font-size: 13px;">Treeningute raport</p>
                        
                        <div style="background: #f4f4f5; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; border: 1px solid #e4e4e7;">
                            <strong>Kasutaja:</strong> ${this.profile.name || 'Nimetu'}<br>
                            <strong>Vanus:</strong> ${this.profile.age || '-'} a &nbsp;|&nbsp; <strong>Kaal:</strong> ${this.profile.weight || '-'} kg
                        </div>
                `;

                this.history.forEach((session) => {
                    pdfContentHTML += `
                        <div style="border: 1px solid #e4e4e7; border-radius: 8px; padding: 14px; margin-bottom: 12px; background: #fafafa;">
                            <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #e4e4e7; padding-bottom: 8px; margin-bottom: 8px;">
                                <strong style="font-size: 16px; color: #000;">${session.machine}</strong>
                                <span style="font-size: 12px; color: #666;">${session.date} kell ${session.time}</span>
                            </div>
                            <div style="font-size: 13px;">
                    `;
                    session.sets.forEach((s, i) => {
                        pdfContentHTML += `
                            <div style="display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #eee;">
                                <span style="color: #666;">Seeria ${i + 1}</span>
                                <span style="color: #000; font-weight: 700;">${s.weight} kg × ${s.reps} kordust</span>
                            </div>
                        `;
                    });
                    pdfContentHTML += `</div></div>`;
                });

                pdfContentHTML += `</div>`;

                // 2. Loome prindi konteineri ja peidame hetkeks põhirakenduse
                const printContainer = document.createElement('div');
                printContainer.innerHTML = pdfContentHTML;
                printContainer.style.padding = '30px';
                printContainer.style.background = '#ffffff';
                printContainer.style.minHeight = '100vh';
                
                const mainApp = document.getElementById('main-app');
                
                // Peidame äpi ja paneme valge prinditava osa ekraanile
                mainApp.style.display = 'none';
                document.body.appendChild(printContainer);
                document.body.style.background = '#ffffff';

                const opt = {
                    margin:       0.5,
                    filename:     `Treeningud_${this.profile.name || 'Logi'}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true, scrollY: 0 },
                    jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
                };

                // Teeme PDF-i ja taastame äpi esialgse oleku
                setTimeout(() => {
                    html2pdf().set(opt).from(printContainer).save().then(() => {
                        document.body.removeChild(printContainer);
                        mainApp.style.display = 'flex';
                        document.body.style.background = "url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1470&auto=format&fit=crop') no-repeat center center fixed";
                        document.body.style.backgroundSize = "cover";
                    }).catch(err => {
                        alert("Viga PDF-i salvestamisel: " + err);
                        document.body.removeChild(printContainer);
                        mainApp.style.display = 'flex';
                    });
                }, 100);
            }
        };

        window.onload = function() {
            app.init();
        };
    </script>
</body>
</html>
