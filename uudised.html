<!doctype html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StreamHub Eesti — Gaming Uudised</title>
<link rel="icon" type="image/png" href="https://cdn.phototourl.com/member/2026-08-20-ab6e8157-85d2-41f1-9fec-7253e8261e59.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">

<style>
    /* TAUST - Sinu valitud pilt */
    html, body { 
        margin: 0; padding: 0; min-height: 100vh;
        background: url('https://img.sanishtech.com/u/d7837ef85f49a0cb59c038ff54a8f469.jpg') no-repeat center center fixed; 
        background-size: cover;
        background-color: #050505; 
    }
    
    /* Et taust liiga ere poleks ja valge tekst loetav püsiks */
    body::before {
        content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(10, 10, 15, 0.7); z-index: -1;
    }

    /* MENÜÜRIBA KLAASEFEKT */
    .topbar {
        position: sticky; top: 0; z-index: 100;
        background: rgba(10, 10, 15, 0.75) !important;
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
        padding: 10px 20px;
    }
    .brand img { height: 150px; width: auto; display: block; transition: height 0.3s ease; } 

    /* UUDISTE LEHE DISAIN */
    .news-container { max-width: 1200px; margin: 0 auto; padding: 120px 20px 60px; }
    
    /* ESILETÕSTETUD UUDIS */
    .featured-news {
        display: flex; gap: 2rem; margin-bottom: 3rem;
        background: rgba(20, 20, 25, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: transform 0.3s ease;
    }
    .featured-news:hover { transform: translateY(-5px); border-color: rgba(255, 255, 255, 0.15); }
    .featured-news-img { width: 55%; position: relative; overflow: hidden; }
    .featured-news-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .featured-news:hover .featured-news-img img { transform: scale(1.05); }
    .featured-news-content { padding: 3rem 2rem; width: 45%; display: flex; flex-direction: column; justify-content: center; }
    .news-source { font-family: 'Space Grotesk', sans-serif; font-size: 0.85rem; color: #ff3b30; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .featured-news h3 { font-size: 2.2rem; margin: 0 0 1rem; line-height: 1.1; color: white; }
    .featured-news p { color: #a0a0b0; font-size: 1.1rem; margin-bottom: 2rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

    /* UUDISTE GRID */
    .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; }
    .news-card {
        background: rgba(20, 20, 25, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; overflow: hidden;
        display: flex; flex-direction: column; transition: all 0.3s ease; cursor: pointer; text-decoration: none;
    }
    .news-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.5); border-color: rgba(255, 255, 255, 0.15); }
    .news-img-wrap { width: 100%; height: 200px; overflow: hidden; }
    .news-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .news-card:hover .news-img-wrap img { transform: scale(1.05); }
    .news-body { padding: 1.5rem; display: flex; flex-direction: column; flex-grow: 1; }
    .news-body h4 { color: #fff; font-size: 1.25rem; margin: 0 0 0.8rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .news-body p { color: #888; font-size: 0.95rem; margin-bottom: 1.5rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .news-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1rem; }
    .news-date { color: #666; font-size: 0.8rem; }
    
    .read-more { background: #fff; color: #000; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 700; align-self: flex-start; transition: background 0.2s; }
    .read-more:hover { background: #e0e0e0; }
    
    #loadingSpinner { text-align: center; padding: 4rem 0; color: #a0a0b0; font-size: 1.2rem; }

    /* MOBIILI FIX */
    @media (max-width: 768px) {
        .brand img { height: 45px; }
        .nav { order: 3; width: 100%; display: flex; overflow-x: auto; padding: 12px 0 5px 0; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.08); gap: 15px; }
        .actions { order: 2; display: flex; gap: 8px; }
        
        .news-container { padding-top: 20px; }
        .featured-news { flex-direction: column; }
        .featured-news-img { width: 100%; height: 250px; }
        .featured-news-content { width: 100%; padding: 2rem 1.5rem; }
    }
</style>
</head>
<body>

<header class="topbar">
<a class="brand" href="index.html"><img src="https://cdn.phototourl.com/free/2026-08-20-416aa20b-acbe-4325-9e61-566645e3254c.png" alt="Streaming Hub logo"></a>
<nav class="nav">
    <a href="index.html#games">MÄNGUD</a>
    <a href="index.html#live">LIVE</a>
    <a href="index.html#streamers">STRIIMERID</a>
    <!-- Tähistame, et oleme uudiste lehel -->
    <a href="#" style="color: #fff; font-weight: 700; border-bottom: 2px solid #ff3b30;">UUDISED</a>
</nav>
<div class="actions">
    <button class="btn" onclick="window.location.href='index.html'">TAGASI PEALEHELE</button>
</div>
</header>

<main class="news-container">
    <div class="section-head">
        <div>
            <div class="eyebrow" style="color: #ff3b30;">GLOBAL GAMING NEWS</div>
            <h2>Gaming <span>Uudised</span></h2>
        </div>
    </div>

    <div id="loadingSpinner">Laen värskemaid uudiseid maailma mänguportaalidest...</div>
    
    <div id="featuredTarget"></div>
    <div id="newsGrid" class="news-grid"></div>
</main>

<footer>© 2026 StreamHub Eesti</footer>

<script>
    // Kasutame RSS to JSON teenust (tasuta versiooni)
    const RSS_FEEDS = [
        'https://www.pcgamer.com/rss/',
        'https://feeds.ign.com/ign/games-all'
    ];

    async function fetchNews() {
        try {
            let allNews = [];
            
            for (let feed of RSS_FEEDS) {
                const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed)}`);
                const data = await response.json();
                
                if (data.status === 'ok') {
                    const source = data.feed.title.includes('IGN') ? 'IGN' : 'PC Gamer';
                    
                    const items = data.items.map(item => {
                        // Kood otsib uudise thumbnaili (RSS feedid on väga sassis tihti)
                        let imgUrl = item.thumbnail || (item.enclosure && item.enclosure.link);
                        if (!imgUrl) {
                            const imgMatch = item.description.match(/<img[^>]+src="([^">]+)"/);
                            imgUrl = imgMatch ? imgMatch[1] : 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&q=80&w=800'; 
                        }
                        
                        // Puhastab HTML-i tekstist välja
                        let cleanDesc = item.description.replace(/<[^>]*>?/gm, '').trim();
                        if (cleanDesc.length > 180) cleanDesc = cleanDesc.substring(0, 177) + '...';

                        return {
                            title: item.title,
                            link: item.link,
                            pubDate: new Date(item.pubDate),
                            image: imgUrl,
                            description: cleanDesc,
                            source: source
                        };
                    });
                    allNews = allNews.concat(items);
                }
            }

            // Sorteerime kuupäeva järgi, et näha kõige värskemat ees
            allNews.sort((a, b) => b.pubDate - a.pubDate);
            renderNews(allNews);

        } catch (error) {
            console.error("Viga uudiste laadimisel:", error);
            document.getElementById('loadingSpinner').innerHTML = "Tekkis viga uudiste laadimisel. Proovi hiljem uuesti.";
        }
    }

    function renderNews(newsItems) {
        document.getElementById('loadingSpinner').style.display = 'none';
        if (newsItems.length === 0) return;

        // Esimene uudis on alati FEATURED
        const featured = newsItems[0];
        document.getElementById('featuredTarget').innerHTML = `
            <a href="${featured.link}" target="_blank" rel="noopener" class="featured-news" style="text-decoration: none;">
                <div class="featured-news-img">
                    <img src="${featured.image}" alt="Featured news">
                </div>
                <div class="featured-news-content">
                    <div class="news-source">${featured.source} · ${featured.pubDate.toLocaleDateString('et-EE')}</div>
                    <h3>${featured.title}</h3>
                    <p>${featured.description}</p>
                    <span class="read-more">LOE ARTIKLIT →</span>
                </div>
            </a>
        `;

        // Järgmised 12 lähvad gridi, et leht ei veniks kilomeetri pikkuseks
        const gridItems = newsItems.slice(1, 13);
        document.getElementById('newsGrid').innerHTML = gridItems.map(item => `
            <a href="${item.link}" target="_blank" rel="noopener" class="news-card">
                <div class="news-img-wrap"><img src="${item.image}" alt="News image" loading="lazy"></div>
                <div class="news-body">
                    <div class="news-source" style="font-size: 0.75rem;">${item.source}</div>
                    <h4>${item.title}</h4>
                    <p>${item.description}</p>
                    <div class="news-footer">
                        <span class="news-date">${item.pubDate.toLocaleDateString('et-EE')}</span>
                        <span style="color: #fff; font-weight: 600; font-size: 0.85rem;">LOE EDASI ›</span>
                    </div>
                </div>
            </a>
        `).join('');
    }

    document.addEventListener("DOMContentLoaded", fetchNews);
</script>
</body>
</html>
