<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub PRO Admin</title>
    
    <!-- Uus tab-logo (Favicon) -->
    <link rel="icon" type="image/png" href="https://cdn.phototourl.com/member/2026-08-20-ab6e8157-85d2-41f1-9fec-7253e8261e59.png">
    
    <link rel="stylesheet" href="admin.css">
    
    <style>
        /* Sisselogimise ekraani paigutus */
        #loginScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 40px; 
            padding: 20px;
        }

        /* HIIGELSUUR LOGO SISSELOGIMISEL */
        .login-logo {
            display: block;
            width: 100%;
            max-width: 700px;
            height: auto;
            margin: 0;
        }

        /* Küljemenüü logo */
        .sidebar-logo {
            height: 32px;
            vertical-align: middle;
            margin-right: 12px;
            margin-bottom: 5px;
            border-radius: 6px;
        }
        
        /* Modaalakna inputide disain */
        .modal-input {
            width: 100%; padding: 10px; margin-bottom: 12px; margin-top: 4px;
            border-radius: 4px; border: 1px solid #333; background: #0f0f13; color: white;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- SISSELOGIMISE EKRAAN -->
    <div id="loginScreen" class="fullscreen-center">
        <img src="https://cdn.phototourl.com/free/2026-08-20-6d8cd5df-b807-4252-aba7-2ea972f88aa3.png" alt="StreamHub Logo" class="login-logo">
        <div class="login-box">
            <h2>Admin Sisselogimine</h2>
            <form id="adminLoginForm">
                <input type="email" name="email" placeholder="E-posti aadress" required>
                <input type="password" name="password" placeholder="Parool" required>
                <button type="submit" class="primary-btn">LOGI SISSE</button>
                <div id="loginError" class="notice error hidden"></div>
            </form>
        </div>
    </div>

    <!-- PÕHILINE DASHBOARD -->
    <div id="adminDashboard" class="dashboard hidden">
        <!-- Küljemenüü -->
        <aside class="sidebar">
            <div class="brand">
                <img src="https://cdn.phototourl.com/member/2026-08-20-ab6e8157-85d2-41f1-9fec-7253e8261e59.png" alt="Logo" class="sidebar-logo">
                STREAMHUB<br><span>PRO ADMIN</span>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-btn active" data-tab="streamers">Striimerid</button>
                <button class="nav-btn" data-tab="applications">Taotlused</button>
                <button class="nav-btn" data-tab="logs">Süsteemi Logid</button>
            </nav>
            <div class="sidebar-bottom">
                <button id="logoutBtn" class="nav-btn danger">Logi välja</button>
            </div>
        </aside>

        <!-- Sisu ala -->
        <main class="content">
            <div id="tab-streamers" class="tab-content active">
                <header style="display: flex; justify-content: space-between; align-items: center;">
                    <h1>Hallatavad Striimerid</h1>
                    <button id="openAddModalBtn" class="primary-btn" style="width: auto; padding: 10px 20px;">+ Lisa Striimer</button>
                </header>
                <div class="card-table" id="streamersList">Laen andmeid...</div>
            </div>
            <div id="tab-applications" class="tab-content hidden">
                <header><h1>Liitumistaotlused</h1></header>
                <div class="card-table" id="appsList">Laen andmeid...</div>
            </div>
            <div id="tab-logs" class="tab-content hidden">
                <header><h1>Ajalugu & Logid</h1></header>
                <div class="card-table" id="logsList">Laen andmeid...</div>
            </div>
        </main>
    </div>

    <!-- STRIIMERI LISAMISE MODAAL -->
    <div id="addModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center;">
        <div class="login-box" style="width: 450px; max-width: 90%; background: #1a1a24; padding: 25px; border-radius: 8px;">
            <h2 style="margin-top: 0;">Lisa Uus Striimer</h2>
            <form id="addStreamerForm">
                <label style="font-size: 12px; color: #aaa;">NIMI</label>
                <input type="text" id="addName" class="modal-input" placeholder="nt. Stenboody" required>
                
                <label style="font-size: 12px; color: #aaa;">PLATVORM</label>
                <select id="addPlatform" class="modal-input" required>
                    <option value="TikTok">TikTok</option>
                    <option value="Twitch">Twitch</option>
                    <option value="YouTube">YouTube</option>
                    <option value="Kick">Kick</option>
                </select>
                
                <label style="font-size: 12px; color: #aaa;">MÄNG (Valikuline)</label>
                <input type="text" id="addGame" class="modal-input" placeholder="nt. Fortnite">
                
                <label style="font-size: 12px; color: #aaa;">KANALI URL</label>
                <input type="url" id="addUrl" class="modal-input" placeholder="https://www.tiktok.com/@kasutaja" required>
                
                <label style="font-size: 12px; color: #aaa;">PILT / THUMBNAIL URL (Valikuline)</label>
                <input type="url" id="addThumb" class="modal-input" placeholder="https://...">
                
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button type="submit" class="primary-btn" style="flex: 1;">LISA</button>
                    <button type="button" class="action-btn danger" onclick="closeAddModal()" style="flex: 1;">TÜHISTA</button>
                </div>
            </form>
        </div>
    </div>

    <!-- STRIIMERI MUUTMISE MODAAL (Peidetud) -->
    <div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center;">
        <div class="login-box" style="width: 450px; max-width: 90%; background: #1a1a24; padding: 25px; border-radius: 8px;">
            <h2 style="margin-top: 0;">Muuda Striimerit</h2>
            <form id="editStreamerForm">
                <input type="hidden" id="editId">
                
                <label style="font-size: 12px; color: #aaa;">NIMI</label>
                <input type="text" id="editName" class="modal-input" required>
                
                <label style="font-size: 12px; color: #aaa;">PLATVORM</label>
                <select id="editPlatform" class="modal-input" required>
                    <option value="Twitch">Twitch</option>
                    <option value="YouTube">YouTube</option>
                    <option value="Kick">Kick</option>
                    <option value="TikTok">TikTok</option>
                </select>
                
                <label style="font-size: 12px; color: #aaa;">MÄNG (Valikuline)</label>
                <input type="text" id="editGame" class="modal-input">
                
                <label style="font-size: 12px; color: #aaa;">KANALI URL</label>
                <input type="url" id="editUrl" class="modal-input" required>
                
                <label style="font-size: 12px; color: #aaa;">PILT / THUMBNAIL URL (Valikuline)</label>
                <input type="url" id="editThumb" class="modal-input" placeholder="https://...">
                
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button type="submit" class="primary-btn" style="flex: 1;">SALVESTA</button>
                    <button type="button" class="action-btn danger" onclick="closeEditModal()" style="flex: 1;">TÜHISTA</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Teavitused (Toast) -->
    <div id="toast" class="toast"></div>

    <!-- SKRIPTID -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="admin.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const addModal = document.getElementById('addModal');
            const openAddBtn = document.getElementById('openAddModalBtn');
            const addForm = document.getElementById('addStreamerForm');
            
            // 1. Modaali avamine
            if (openAddBtn) {
                openAddBtn.addEventListener('click', () => {
                    addModal.style.display = 'flex';
                });
            }

            // 2. Uue striimeri salvestamine
            if (addForm) {
                addForm.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    // Loome andmebaasi ühenduse kasutades sinu config.js muutujaid
                    const supabaseClient = supabase.createClient(
                        window.STREAMHUB_CONFIG.SUPABASE_URL,
                        window.STREAMHUB_CONFIG.SUPABASE_PUBLISHABLE_KEY
                    );

                    const name = document.getElementById('addName').value.trim();
                    const platform = document.getElementById('addPlatform').value;
                    const game = document.getElementById('addGame').value.trim();
                    const channel_url = document.getElementById('addUrl').value.trim();
                    const thumbnail_url = document.getElementById('addThumb').value.trim();

                    try {
                        // Salvestame andmebaasi
                        const { error } = await supabaseClient
                            .from('streamers')
                            .insert([{ 
                                name, 
                                platform, 
                                game: game || null, 
                                channel_url, 
                                thumbnail_url: thumbnail_url || null,
                                is_live: false, 
                                viewers: 0 
                            }]);

                        if (error) {
                            alert('Viga andmebaasi lisamisel! Veateade: ' + error.message);
                            console.error(error);
                        } else {
                            alert('Striimer edukalt lisatud!');
                            closeAddModal();
                            location.reload();
                        }
                    } catch (err) {
                        alert('Süsteemne viga lisamisel: ' + err.message);
                        console.error(err);
                    }
                });
            }
        });

        // Modaali sulgemine
        function closeAddModal() {
            const modal = document.getElementById('addModal');
            if (modal) modal.style.display = 'none';
            const form = document.getElementById('addStreamerForm');
            if (form) form.reset();
        }
    </script>
</body>
</html>
